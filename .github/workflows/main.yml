name: 🩺 Clinic Android Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build AAB (release)
        run: ./bundleRelease || ./gradlew bundleRelease

      - name: Sign AAB (if keystore secrets exist)
        if: env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Signing AAB..."
          # سيتم التوقيع تلقائياً هنا

      - name: Verify outputs
        run: |
          find . -name "*.aab" -o -name "*.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinic-release-bundle
          path: |
            **/output/bundle/release/*.aab
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
