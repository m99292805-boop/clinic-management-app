name: 🏥 Clinic Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 📍 Detect project folder
        run: |
          CFG=$(find . -maxdepth 3 -name "capacitor.config.*" -not -path "*/node_modules/*" | head -n1)
          [ -n "$CFG" ] || { echo "capacitor config not found"; exit 1; }
          P=$(cd "$(dirname "$CFG")" && pwd)
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$P/android" >> "$GITHUB_ENV"

      - name: 📥 Install dependencies
        run: |
          cd "$PROJECT_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # نسخة Google Play: بدون أي شاشة دفع داخل التطبيق (VITE_PLAY_BUILD)
      - name: 🏗️ Build web (Vite, Play mode)
        env:
          VITE_PLAY_BUILD: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          rm -f dist/shamcash-qr.jpg

      - name: 🔄 Capacitor sync
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          [ -d "$ANDROID_DIR" ] || npx cap add android
          # أيقونة التطبيق + شاشة البداية من مجلد resources
          npx capacitor-assets generate --android
          npx cap sync android
          if [ -f "$ANDROID_DIR/app/src/main/assets/public/shamcash-qr.jpg" ]; then
            echo "payment QR still in Play build"; exit 1
          fi

      - name: 🔢 Set app version (must increase on Google Play)
        run: |
          set -euo pipefail
          G="$ANDROID_DIR/app/build.gradle"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -q "versionCode ${{ github.run_number }}" "$G" || { echo "versionCode was not set"; cat "$G"; exit 1; }
          grep -nE "versionCode|versionName" "$G"

      - name: 🛡️ Disable backup
        run: |
          F="$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          [ -f "$F" ] || { echo "Manifest not found"; exit 1; }
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$F"
          grep -q 'android:allowBackup="false"' "$F"

      - name: 🔐 chmod gradlew
        run: chmod +x "$ANDROID_DIR/gradlew"

      - name: 📦 Build AAB (release)
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew bundleRelease --no-daemon -x lint

      - name: ✍️ Sign AAB
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          KS_B64_1: ${{ secrets.ANDROID_KEYSTORE_B64_1 }}
          KS_B64_2: ${{ secrets.ANDROID_KEYSTORE_B64_2 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "AAB not found"; exit 1; }
          echo "part1 length: ${#KS_B64_1}"
          echo "part2 length: ${#KS_B64_2}"
          printf '%s%s' "$KS_B64_1" "$KS_B64_2" | tr -d '[:space:]' | base64 -d > release.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          rm -f release.jks

      - name: ☁️ Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-release-aab
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
