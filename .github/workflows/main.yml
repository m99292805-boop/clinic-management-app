name: 🏥 Clinic Android Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build:
    name: 🔨 Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Locate project root
        run: |
          set -eu
          DIR=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if grep -q '"@capacitor/core"' "$f"; then DIR="$d"; break; fi
          done < <(find . -name package.json -not -path "*/node_modules/*" -not -path "./.git/*" | sort)
          PROJECT_DIR=$(cd "$DIR" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR"        >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-${{ env.API_LEVEL }} build-tools;${{ env.BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: 📦 Install dependencies
        run: |
          cd "$PROJECT_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 🏗️ Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: 🔄 Capacitor sync
        run: |
          cd "$PROJECT_DIR"
          [ -d "$ANDROID_DIR" ] || npx cap add android
          npx cap sync android

      - name: 🔐 chmod gradlew
        run: chmod +x "$ANDROID_DIR/gradlew"

      - name: 📦 Build AAB (release)
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew bundleRelease --no-daemon -x lint

      - name: ✍️ Generate Keystore & Sign AAB Automatically
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail
          AAB=$(find . -name "*.aab" -path "*release*" | head -n1)
          
          # إنشاء شهادة توقيع آمنة تلقائياً للتسليم الفوري
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias clinicapp -passin pass:clinicpassword -passout pass:clinicpassword \
            -dname "CN=Basil Al-Kanj, OU=Clinic App, O=Alking, L=Khan Sheikhoun, ST=Idlib, C=SY"

          # توقيع الملف مباشرة
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.jks \
            -storepass clinicpassword -keypass clinicpassword \
            "$AAB" clinicapp

          rm -f release.jks
          echo "✅ AAB signed successfully and automatically"

      - name: ☁️ Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-release-aab
          path: |
            **/*.aab
          if-no-files-found: error
