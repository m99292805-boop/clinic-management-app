<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F4B3F" />
    <!-- حماية: يمنع تحميل أي شي من خارج التطبيق وSupabase، ويمنع إرسال بيانات لأي موقع غريب -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>نظام إدارة العيادات</title>
  </head>
  <body style="margin:0;background:#f7f3e9">
    <div id="root"></div>
    <!-- شاشة تحميل وخطأ ثابتة: تظهر قبل تشغيل React، وتعرض أي خطأ بدل الشاشة السوداء -->
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f3e9;color:#1f4b3f;font-family:sans-serif;font-size:14px;text-align:center;padding:20px;z-index:0">جاري التحميل...</div>
    <noscript><div style="padding:20px;font-family:sans-serif">يلزم تفعيل JavaScript</div></noscript>
    <script nomodule>document.getElementById('boot').innerHTML='متصفح النظام (Android System WebView) قديم. حدّثه من متجر Play ثم أعد فتح التطبيق.'</script>
    <script>
      function showBootError(m){var b=document.getElementById('boot');if(b){b.style.zIndex='9999';b.style.flexDirection='column';b.innerHTML='<div style="font-weight:700;margin-bottom:8px">تعذّر تشغيل التطبيق</div><div style="direction:ltr;word-break:break-word;font-size:12px;color:#6b6b62">'+String(m).replace(/</g,'&lt;')+'</div><button onclick="location.reload()" style="margin-top:14px;background:#1f4b3f;color:#fff;border:0;border-radius:12px;padding:10px 22px">إعادة المحاولة</button>'}}
      window.addEventListener('error',function(e){if(!window.__appMounted)showBootError(e.message||'Script error')});
      window.addEventListener('unhandledrejection',function(e){if(!window.__appMounted)showBootError((e.reason&&e.reason.message)||e.reason)});
      setTimeout(function(){if(!window.__appMounted)showBootError('انتهت مهلة التحميل')},15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
